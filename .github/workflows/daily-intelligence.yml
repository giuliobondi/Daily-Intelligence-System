name: Daily Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"
      timezone: "Europe/Rome"

concurrency:
  group: daily-intelligence-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Test and run pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and test dependencies
        run: python -m pip install ".[dev]"

      - name: Run automated tests
        run: python -m pytest

      - name: Run production pipeline
        run: python -m daily_intelligence.cli run

      - name: Validate generated outputs
        shell: bash
        run: |
          report_date="$(date -u +%F)"
          year="$(date -u +%Y)"
          month="$(date -u +%m)"

          records_path="data/processed/${year}/${month}/${report_date}.jsonl"
          summary_path="data/runs/${year}/${month}/${report_date}.json"
          report_path="reports/daily/${year}/${month}/${report_date}.md"

          test -s "$records_path"
          test -s "$summary_path"
          test -s "$report_path"

          echo "Validated records: $records_path"
          echo "Validated summary: $summary_path"
          echo "Validated report: $report_path"

      - name: Commit generated outputs
        shell: bash
        run: |
          git add \
            data/processed \
            data/runs \
            reports/daily

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "data: update daily intelligence outputs"
          git push